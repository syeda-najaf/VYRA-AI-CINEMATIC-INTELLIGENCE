services:
  - type: web
    name: vyra-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --no-audit --no-fund
    startCommand: npm run start:api
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: VYRA_GENERATION_ENABLED
        value: "false"
      - key: VYRA_MAX_CONCURRENT
        value: "1"
      - key: CORS_ORIGINS
        value: https://vyra-ai-cinematic-intelligence.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
