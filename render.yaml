services:
  - type: web
    name: vyra-ai-preview
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --no-audit --no-fund && npm run export:web
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: VYRA_GENERATION_ENABLED
        value: "false"
      - key: VYRA_MAX_CONCURRENT
        value: "1"
